# MASTER PROFILE: single source of truth.
# Copy this file to profile/master_profile.yaml and replace everything with your own facts.
# Tailoring may SELECT, REORDER and REWORD items from this file. It may NEVER add
# employers, dates, tools, metrics or achievements that are not written here.
# Entries marked TODO are incomplete and must not be used until filled in.
# This example person and all employers are fictional.

personal:
  name: Alex Example
  location: Berlin, Germany
  phone: "+49 30 0000000"
  email: alex.example@example.com
  links:
    linkedin: https://www.linkedin.com/in/alex-example
    github: https://github.com/alex-example
    portfolio: https://alex-example.dev/
  header_badge: EU Blue Card        # optional short badge in the CV header (e.g. work permit). Remove if not needed.
  work_authorization: EU Blue Card (Germany), no sponsorship required
  languages:
    - { language: English, level: C1 }
    - { language: German, level: B1 }

target:
  roles: [Cloud Engineer, DevOps Engineer, Platform Engineer, Site Reliability Engineer, MLOps Engineer,
          QA Automation Engineer]
  seniority: [Junior, Mid]
  work_mode: [onsite, hybrid, remote]
  country: Germany
  relocation: anywhere in Germany
  posting_language: English and German postings (CV and cover letter in English)

# One summary per track. Scoring picks a track per job, tailoring starts from that summary.
summaries:
  devops: >-
    DevOps Engineer running Kubernetes and Helm platforms and CI/CD pipelines. Moved EC2 services to
    Amazon EKS with Terraform and built GitHub Actions pipelines with SonarQube checks and Grafana alerting.
  ai_ml: >-
    Engineer combining DevOps and machine learning: built a CI/CD pipeline for ML models and deployed a
    text classifier on SageMaker, on top of production Kubernetes and Terraform experience.
  qa: >-
    Automation engineer spanning test automation and DevOps: wrote 120 Selenium test scripts and added
    quality gates (SonarQube) to CI/CD pipelines.

